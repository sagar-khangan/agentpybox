[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agenthaven"
version = "1.0.0"
description = "Local-first Linux Bubblewrap sandboxes: Python SDK and CLI, no server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
agenthaven = "agenthaven.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthaven"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
