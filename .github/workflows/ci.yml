name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install system sandbox tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - name: Install project
        run: uv sync --extra dev
      - name: Lint
        run: uv run --extra dev ruff check src tests examples
      - name: Formatting
        run: uv run --extra dev ruff format --check src tests examples
      - name: Tests
        run: uv run --extra dev pytest -q
      - name: Build distributions
        run: uv build
      - name: CLI smoke test
        run: uv run agenthaven env list
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
